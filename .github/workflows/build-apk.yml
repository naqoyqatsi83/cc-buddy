name: Build APK

# Deliberately narrow: this repo's default working branch is
# `development` (see scripts/install.*), so pushes there should NOT
# trigger a build on every commit. Only `main` (release-ready merges)
# and version tags do. workflow_dispatch is included for an on-demand
# build without needing either.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # softprops/action-gh-release needs write access to create the release
    # and upload the APK -- the default GITHUB_TOKEN is read-only unless
    # granted explicitly here.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Derive version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        working-directory: android
        # Written into app/ -- build.gradle.kts's signingConfigs.release
        # resolves RELEASE_KEYSTORE_PATH via file(), which is relative to
        # the app module's own projectDir (android/app), not the working
        # directory these gradlew steps run from (android/).
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ steps.version.outputs.name }}" ]; then
            ./gradlew assembleRelease --no-daemon \
              -PreleaseVersionName="${{ steps.version.outputs.name }}" \
              -PreleaseVersionCode="${{ steps.version.outputs.code }}"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cc-buddy-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          # Tagged builds already publish the APK as a permanent GitHub
          # Release asset below -- this copy is only useful for a short
          # window (e.g. inspecting a workflow_dispatch/non-tag build), so
          # don't let it linger and eat into the account's shared Actions
          # storage quota (public repos count toward the meter too, even
          # though their usage is billed at $0).
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
