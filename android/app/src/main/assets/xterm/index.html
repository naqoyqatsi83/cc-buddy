<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    /* The terminal renders at the PC terminal's actual size (see
       resizeTerm below), which is usually wider than the phone screen.
       #term gets a definite full-height box — xterm.js's own internal
       scrollback viewport is absolutely-positioned and needs a
       definite-height ancestor to size itself, without one its vertical
       scroll silently collapses. #scrollx handles only the *horizontal*
       overflow (the wide dimension) so panning sideways doesn't fight
       with xterm's own vertical scroll handling. */
    html, body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      height: 100%;
      overflow: hidden;
    }
    #scrollx {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
    #term {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="scrollx"><div id="term"></div></div>
  <script src="xterm.js"></script>
  <script>
    var MIN_FONT_SIZE = 8;
    var MAX_FONT_SIZE = 22;
    // Empirical: xterm's rendered row height for the default lineHeight
    // (1.0) comes out to roughly 1.3x the font size for a typical
    // monospace font — used only to pick a starting font size that makes
    // reasonable use of the available height, not for exact layout.
    var ROW_HEIGHT_FACTOR = 1.15;

    var term = new Terminal({
      convertEol: true,
      fontSize: 13,
      fontFamily: "monospace",
      theme: { background: "#0d0d0d", foreground: "#e0e0e0" },
      disableStdin: true,
      scrollback: 5000
    });
    term.open(document.getElementById("term"));

    // Called from Android whenever the PC terminal's size is known (once
    // at pairing, again if the PC resizes its window). Mirrors that exact
    // cols/rows — never reflows to the phone's width — since the source
    // (Claude Code's TUI) uses absolute cursor positioning sized for its
    // own terminal; a differently-sized mirror renders garbled.
    function resizeTerm(cols, rows) {
      var targetHeight = window.innerHeight;
      // Round UP: xterm always auto-scrolls to show its newest line, so a
      // terminal that's at least full height puts the prompt/last line
      // right at the screen's bottom edge, with any overshoot simply
      // becoming vertically scrollable. Undershooting instead would leave
      // a dead gap below the content and the prompt floating mid-screen.
      var fontSize = Math.ceil(targetHeight / (rows * ROW_HEIGHT_FACTOR));
      fontSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, fontSize));
      term.options.fontSize = fontSize;
      term.resize(cols, rows);
    }

    // Called from Android via evaluateJavascript(); base64 avoids any
    // escaping headaches with control chars / ANSI sequences in raw PTY
    // output.
    function writeChunkB64(b64) {
      // Decode to raw bytes (not a JS string) so xterm's UTF-8 decoder
      // handles multi-byte characters correctly instead of misreading
      // each byte as its own UTF-16 code unit.
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      term.write(bytes);
    }

    function clearTerminal() {
      term.reset();
    }
  </script>
</body>
</html>
