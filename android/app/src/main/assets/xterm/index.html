<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    /* #term gets a definite full-height box — xterm.js's own internal
       scrollback viewport is absolutely-positioned and needs a
       definite-height ancestor to size itself, without one its vertical
       scroll silently collapses. #scrollx handles only the *horizontal*
       overflow (columns usually exceed the phone's width) so panning
       sideways doesn't fight with xterm's own vertical scroll handling. */
    html, body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      height: 100%;
      overflow: hidden;
    }
    #scrollx {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
    #term {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="scrollx"><div id="term"></div></div>
  <script src="xterm.js"></script>
  <script>
    // Fixed, comfortably-readable size — deliberately NOT derived from the
    // PC terminal's row count. Rows are a phone-local concern: we compute
    // how many fit at this font size and let xterm's own scrollback
    // handle whatever doesn't fit, exactly like resizing a real terminal
    // window shorter. This also means resizing the PC terminal's *height*
    // no longer touches the phone's font size at all.
    var FONT_SIZE = 14;
    // Empirical row height at FONT_SIZE for this WebView's font metrics.
    var ROW_HEIGHT = 17;

    var term = new Terminal({
      convertEol: true,
      fontSize: FONT_SIZE,
      fontFamily: "monospace",
      theme: { background: "#0d0d0d", foreground: "#e0e0e0" },
      disableStdin: true,
      scrollback: 5000
    });
    term.open(document.getElementById("term"));

    function localRowCount() {
      return Math.max(4, Math.floor(window.innerHeight / ROW_HEIGHT));
    }

    // Called from Android whenever the PC terminal's width is known (once
    // at pairing, again if the PC resizes its window). Mirrors *columns*
    // exactly — the source (Claude Code's TUI) uses absolute cursor
    // positioning sized for its own terminal width, so a different column
    // count renders garbled. Rows are always phone-native (see above), so
    // the `rows` argument here is intentionally unused.
    function resizeTerm(cols, rows) {
      term.resize(cols, localRowCount());
    }

    window.addEventListener("resize", function () {
      term.resize(term.cols, localRowCount());
    });

    // Called from Android via evaluateJavascript(); base64 avoids any
    // escaping headaches with control chars / ANSI sequences in raw PTY
    // output.
    function writeChunkB64(b64) {
      // Decode to raw bytes (not a JS string) so xterm's UTF-8 decoder
      // handles multi-byte characters correctly instead of misreading
      // each byte as its own UTF-16 code unit.
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      term.write(bytes);
    }

    function clearTerminal() {
      term.reset();
    }
  </script>
</body>
</html>
