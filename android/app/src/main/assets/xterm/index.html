<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    /* #term gets a definite full-height box — xterm.js's own internal
       scrollback viewport is absolutely-positioned and needs a
       definite-height ancestor to size itself, without one its vertical
       scroll silently collapses. #scrollx handles only the *horizontal*
       overflow (columns usually exceed the phone's width) so panning
       sideways doesn't fight with xterm's own vertical scroll handling. */
    html, body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      height: 100%;
      overflow: hidden;
    }
    #scrollx {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      /* Vertical fallback for when the real PC terminal has more rows
         than fit on the phone even at the smallest readable font (this
         user's PC terminal is 86 rows) — without this the bottom of the
         active screen (status line, prompt) is silently clipped with no
         way to reach it, since only genuine scrollback is scrollable,
         not an active grid that's simply too tall for its container.
         #term gets an explicit pixel height below (not the 100% it'd
         otherwise inherit) so it can exceed this box and this becomes
         scrollable. */
      overflow-y: auto;
    }
    #term {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="scrollx"><div id="term"></div></div>
  <script src="xterm.js"></script>
  <script>
    // Mirror the PC terminal's rows AND columns exactly. Tried decoupling
    // rows to a phone-local, fixed-font row count once — broke real
    // Claude Code output (missing header, content overwriting itself).
    // Reason: Claude Code's TUI uses scroll regions (DECSTBM) sized to
    // the real PTY dimensions to keep a header/footer fixed while the
    // middle scrolls; scroll-region math is exact-row-count-sensitive,
    // unlike simple absolute cursor addressing, which just clamps
    // harmlessly to a smaller grid. A remote terminal has to match the
    // real size exactly for *any* TUI app to render correctly — there's
    // no way to know in advance which redraw techniques an app uses.
    var MIN_FONT_SIZE = 8;
    var MAX_FONT_SIZE = 22;
    // Empirical: xterm's rendered row height at a given fontSize (default
    // lineHeight 1.0) comes out to roughly 1.15x the font size for this
    // WebView's monospace metrics — used only to pick a font size that
    // makes good use of the available height, not for exact layout.
    var ROW_HEIGHT_FACTOR = 1.15;

    var term = new Terminal({
      convertEol: true,
      fontSize: 14,
      fontFamily: "monospace",
      theme: { background: "#0d0d0d", foreground: "#e0e0e0" },
      disableStdin: true,
      scrollback: 5000
    });
    term.open(document.getElementById("term"));

    // Called from Android whenever the PC terminal's size is known (once
    // at pairing, again if the PC resizes its window). Font size is
    // chosen to make the real row count fit the available height —
    // rounding DOWN. The active grid (rows == the real PTY's row count)
    // is a fixed-size screen, not itself scrollable: only rows that have
    // actually scrolled off the top become reachable scrollback. Rounding
    // up ("overshoot") was tried first and was wrong — it doesn't create
    // extra scrollable space, it silently clips the bottom row(s) of the
    // active screen (e.g. a status line below the prompt) off-screen with
    // no way to reach them.
    // Track the last known PTY size/container height so either input
    // changing can recompute font size independently.
    var lastCols = null, lastRows = null, lastHeightPx = null;

    function applyFontSizeForCurrentHeight() {
      if (lastRows == null) return;
      // Prefer the real pixel height Android measured for this WebView's
      // Compose-allocated slot (see setContainerHeightPx below) over
      // window.innerHeight: relying on window.innerHeight here previously
      // caused the active grid to be sized for the wrong height (it
      // doesn't reliably reflect the real Compose-measured height,
      // especially right after a layout change) — the *active* screen's
      // overflow rows were then silently clipped, since only true
      // scrollback (content that scrolled off via linefeeds) is
      // scrollable, not an active grid that's simply too tall for its
      // container.
      var heightPx = lastHeightPx != null ? lastHeightPx : window.innerHeight;
      var fontSize = Math.floor(heightPx / (lastRows * ROW_HEIGHT_FACTOR));
      fontSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, fontSize));
      term.options.fontSize = fontSize;
      term.resize(lastCols, lastRows);
      // If the grid still doesn't fit even at MIN_FONT_SIZE (this user's
      // PC terminal is 86 rows), give #term its true full content height
      // so the excess becomes reachable via #scrollx's vertical scroll
      // instead of just clipping.
      var neededPx = Math.ceil(lastRows * fontSize * ROW_HEIGHT_FACTOR);
      document.getElementById("term").style.height = Math.max(neededPx, heightPx) + "px";
      scrollContainerToBottom();
      // term.resize() can itself perturb the scroll position. xterm only
      // auto-follows new output if the viewport was already pinned to the
      // bottom, so any unintended scroll here would silently freeze the
      // mirror mid-stream (new bytes keep arriving into the buffer but the
      // visible viewport stops advancing) even though nothing is broken.
      term.scrollToBottom();
    }

    function scrollContainerToBottom() {
      var sx = document.getElementById("scrollx");
      sx.scrollTop = sx.scrollHeight;
    }

    function resizeTerm(cols, rows) {
      lastCols = cols;
      lastRows = rows;
      applyFontSizeForCurrentHeight();
    }

    // Called from Android (via Modifier.onSizeChanged on the WebView's
    // Compose slot) whenever its real measured pixel height changes —
    // e.g. this app's "Live" pane resizing relative to the History pane
    // above it. This is the authoritative height; window.innerHeight is
    // only a fallback for before the first measurement arrives.
    function setContainerHeightPx(px) {
      lastHeightPx = px;
      applyFontSizeForCurrentHeight();
    }
    window.addEventListener("resize", applyFontSizeForCurrentHeight);

    // Called from Android via evaluateJavascript(); base64 avoids any
    // escaping headaches with control chars / ANSI sequences in raw PTY
    // output.
    function writeChunkB64(b64) {
      // Decode to raw bytes (not a JS string) so xterm's UTF-8 decoder
      // handles multi-byte characters correctly instead of misreading
      // each byte as its own UTF-16 code unit.
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      // write() is async internally (parses on a microtask), so force the
      // follow-tail scroll in its callback rather than right after the
      // call — otherwise this can race the still-pending parse/render and
      // scroll to a position that's immediately stale.
      term.write(bytes, function () {
        term.scrollToBottom();
        scrollContainerToBottom();
      });
    }

    function clearTerminal() {
      term.reset();
    }

    // Approximate CSS-px-per-cell, matching the same approximation
    // already used for row height (ROW_HEIGHT_FACTOR) — avoids depending
    // on xterm's internal (unstable, proposed-API-only) renderer
    // dimensions just to convert a tap into a terminal cell. 0.6 is the
    // typical width/height ratio for a monospace glyph.
    function cellSizePx() {
      var fontSize = term.options.fontSize;
      return { w: fontSize * 0.6, h: fontSize * ROW_HEIGHT_FACTOR };
    }

    // Called from Android with a tap's position in CSS px relative to the
    // WebView. Converts to a 1-indexed terminal cell (accounting for
    // #scrollx's own scroll offsets, both the horizontal pan for wide
    // content and the vertical fallback scroll from applyFontSizeForCurrentHeight)
    // and reports it back to Android to send as a real mouse click — see
    // TerminalScreen.kt's JS interface. Only useful if Claude Code's TUI
    // has mouse reporting enabled at all; untested either way.
    function handleTap(xCss, yCss) {
      var sx = document.getElementById("scrollx");
      var cell = cellSizePx();
      var col = Math.floor((xCss + sx.scrollLeft) / cell.w) + 1;
      var row = Math.floor((yCss + sx.scrollTop) / cell.h) + 1;
      if (window.Android && window.Android.onTerminalTap) {
        window.Android.onTerminalTap(col, row);
      }
    }
  </script>
</body>
</html>
