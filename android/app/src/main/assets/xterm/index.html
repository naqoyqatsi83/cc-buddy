<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    /* #term gets a definite full-height box — xterm.js's own internal
       scrollback viewport is absolutely-positioned and needs a
       definite-height ancestor to size itself. #scrollx handles only the
       *horizontal* overflow (columns usually exceed the phone's width) so
       panning sideways doesn't fight with xterm's own vertical scroll. */
    html, body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      height: 100%;
      overflow: hidden;
    }
    #scrollx {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
    #term {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="scrollx"><div id="term"></div></div>
  <script src="xterm.js"></script>
  <script>
    // One unified view — not two panes. Earlier attempts split "history"
    // (independent, growing) and "live" (1:1 PC mirror) into separate
    // panes; the actual request was a single terminal-like session log,
    // matching how a real terminal works: everything ever shown, freely
    // scrollable, with the prompt/status flush at the bottom, exactly
    // like PageUp/PageDown through real scrollback.
    //
    // This is only safely buildable because of *what* we feed it. Raw PTY
    // bytes need cursor addressing sized to the real PTY's exact rows and
    // cols (Claude Code's TUI uses DECSTBM scroll regions) — matching
    // that exactly is what forced rows to mirror the PC's real (and on
    // this user's setup, unusually tall) terminal, which is what caused
    // most of this session's clipping/sizing bugs. The daemon's
    // shadowTerminal.ts instead captures plain, already-rendered TEXT
    // (diffed against the last capture) — no cursor addressing, no
    // DECSTBM. Writing plain text with normal linefeeds into xterm is a
    // completely different, much simpler case: it accumulates in xterm's
    // own real scrollback like any normal terminal, at whatever font size
    // is actually readable on the phone — rows no longer need to match
    // the PC at all. cols still should (see resizeCols), so long lines
    // don't wrap somewhere different than they were originally formatted
    // for — that's what horizontal scroll is for instead.
    var term = new Terminal({
      convertEol: true,
      fontSize: 14,
      fontFamily: "monospace",
      theme: { background: "#0d0d0d", foreground: "#e0e0e0" },
      disableStdin: true,
      scrollback: 20000
    });
    term.open(document.getElementById("term"));

    var lastCols = null;

    // Called from Android whenever the PC terminal's column count is
    // known — matching cols (not rows) keeps long captured lines from
    // wrapping at a different width than they were originally rendered
    // for; anything still too wide for the phone's screen is reached via
    // #scrollx's horizontal scroll rather than wrapping.
    function resizeCols(cols) {
      if (cols === lastCols) return;
      lastCols = cols;
      term.resize(cols, term.rows);
    }

    // Called from Android with newly-captured history lines (see
    // buddy-daemon/src/shadowTerminal.ts / transcript_init/_append) —
    // plain text, one call per line, base64-encoded the same way as the
    // old raw-byte path to sidestep escaping issues.
    function appendLinesB64(linesB64Json) {
      var linesB64 = JSON.parse(linesB64Json);
      for (var i = 0; i < linesB64.length; i++) {
        var binary = atob(linesB64[i]);
        var bytes = new Uint8Array(binary.length);
        for (var j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
        term.write(bytes);
        term.write("\r\n");
      }
      term.scrollToBottom();
    }

    function clearTerminal() {
      term.reset();
    }

    // Driven explicitly from Android's own GestureDetector rather than
    // relying on the WebView's native touch-to-DOM-scroll handling of
    // xterm's internal viewport — that path proved unreliable across
    // devices earlier in this project (worked in an emulator, did
    // nothing on a real device). scrollLines is xterm's own public API:
    // positive scrolls toward the bottom/newest, negative toward the
    // top/oldest.
    function scrollLines(n) {
      term.scrollLines(n);
    }
  </script>
</body>
</html>
